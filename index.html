<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background: #121314; color: white; font-family: sans-serif;">
    <h1>Page to test the REST API</h1>
    <h2>Available functions</h2>
    <ul>
        <li>get(url)</li>
        <li>post(url, jso)</li>
        <li>patch(url, jso)</li>
        <li>del(url, jso)</li>
    </ul>
</body>
<script>
    function get(url) {
        fetch(url)
            .then(r => r.json())
            .then(console.log);
    }

    function fetchWithMethod(url, jso, method) {
        fetch(url, {
            method: method,
            body: JSON.stringify(jso),
            headers: { 'Content-Type': 'application/json' }
        })
            .then(r => r.json())
            .then(console.log);
    }

    function post(url, jso) {
        fetchWithMethod(url, jso, 'POST');
    }

    function patch(url, jso) {
        fetchWithMethod(url, jso, 'PATCH');
    }

    function del(url, jso) {
        fetchWithMethod(url, jso, 'DELETE');
    }
</script>
</html>
